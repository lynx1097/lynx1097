<svg viewBox="0 0 550 70" width="100%" height="70px" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
        @font-face {
            font-family: 'Ubuntu';
            src: url('./Ubuntu/Ubuntu-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
      
        .banner-bg { fill: #0b0c10; rx: 10px; ry: 10px; }
      
        .blob1 { fill: #00E5FF; opacity: 0.6; animation: float1_s 12s infinite ease-in-out alternate; transform-origin: center; }
        .blob2 { fill: #B141FF; opacity: 0.6; animation: float2_s 14s infinite ease-in-out alternate; transform-origin: center; }
        .blob3 { fill: #FF2E93; opacity: 0.5; animation: float3_s 16s infinite ease-in-out alternate; transform-origin: center; }

        @keyframes float1_s { 0% { transform: translate(0px, 0px); } 50% { transform: translate(80px, -10px); } 100% { transform: translate(-30px, 15px); } }
        @keyframes float2_s { 0% { transform: translate(0px, 0px); } 50% { transform: translate(-60px, 15px); } 100% { transform: translate(50px, -15px); } }
        @keyframes float3_s { 0% { transform: translate(0px, 0px); } 100% { transform: translate(90px, 5px); } }

        .text-soc { font-family: 'Ubuntu', sans-serif; font-size: 26px; font-weight: 700; fill: #ffffff; text-anchor: start; dominant-baseline: central; }
    </style>
    
    <filter id="blurFilter_s_dev" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>

    <clipPath id="bannerClip4">
      <rect width="550" height="70" rx="10" ry="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip4)">
    <rect class="banner-bg" width="550" height="70" />

    <g filter="url(#blurFilter_s_dev)">
      <circle class="blob1" cx="650" cy="35" r="40" />
      <circle class="blob2" cx="250" cy="55" r="50" />
      <circle class="blob3" cx="550" cy="15" r="45" />
    </g>
    
    <rect width="550" height="70" fill="#0b0c10" opacity="0.4" rx="10" ry="10"/>

    <g transform="translate(30, 35)">
        <g transform="translate(-170, -24) scale(0.7)">
            <svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path  fill="#00E5FF" d="M120.12 208.29c-3.88-2.9-7.77-4.35-11.65-4.35H91.03v104.47h17.45c3.88 0 7.77-1.45 11.65-4.35 3.88-2.9 5.82-7.25 5.82-13.06v-69.65c-.01-5.8-1.96-10.16-5.83-13.06zM404.1 32H43.9C19.7 32 .06 51.59 0 75.8v360.4C.06 460.41 19.7 480 43.9 480h360.2c24.21 0 43.84-19.59 43.9-43.8V75.8c-.06-24.21-19.7-43.8-43.9-43.8zM154.2 291.19c0 18.81-11.61 47.31-48.36 47.25h-46.4V172.98h47.38c35.44 0 47.36 28.46 47.37 47.28l.01 70.93zm100.68-88.66H201.6v38.42h32.57v29.57H201.6v38.41h53.29v29.57h-62.18c-11.16.29-20.44-8.53-20.72-19.69V193.7c-.27-11.15 8.56-20.41 19.71-20.69h63.19l-.01 29.52zm103.64 115.29c-13.2 30.75-36.85 24.63-47.44 0l-38.53-144.8h32.57l29.71 113.72 29.57-113.72h32.58l-38.46 144.8z"></path></svg>
        </g>
        
        <text x="65" y="0" class="text-soc">Let's talk technically </text>
    </g>
  </g>
</svg>
