<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 1000 150" width="1000" height="150">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
                @font-face {
                    font-family: 'Ubuntu';
                    src: url('./Ubuntu/Ubuntu-Regular.ttf') format('truetype');
                    font-weight: 400;
                    font-style: normal;
                }

                :root {
                --color-background: #6A2C70;
                --axis-x: 1px;
                --axis-y: 1rem;
                --delay: 10;
                --color-black: #000;
                --color-white: #fff;
                --color-1: #F9ED69;
                --color-2: #F08A5D;
                --color-3: #B83B5E;
                --color-4: #6A2C70;
                --color-5: #4A90E2;
                --color-6: #50E3C2;
                --color-foreground: var(--color-1);
                }
                .container {
                font-family: 'Ubuntu', sans-serif;
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                margin: 0;
                width: 100%;
                height: 150px;
                background: linear-gradient(90deg, var(--color-1), var(--color-2), var(--color-3), var(--color-4), var(--color-5), var(--color-6), var(--color-1));
                background-size: 200% 100%;
                animation: slidingBg 8s ease infinite;
                border-radius: 10px;
                color: rgba(255,255,255,.75);
                text-align: center;
                font-size: 24px;
                overflow: hidden;
                }
                @keyframes slidingBg {
                0% { background-position: 0% center; }
                50% { background-position: 100% center; }
                100% { background-position: 0% center; }
                }
                .bg-slide {
                position: absolute;
                top: -200px;
                left: -200px;
                width: 1400px;
                height: 800px;
                background-image: url("./pc.png");
                background-size: 80px 80px;
                background-repeat: repeat;
                opacity: 0.65;
                animation: slideBg 20s linear infinite;
                }
                @keyframes slideBg {
                0% { transform: translate(0, 0); }
                100% { transform: translate(-160px, -160px); }
                }
                .c-rainbow {
                position: relative;
                z-index: 2;
                counter-reset: rainbow;
                list-style: none;
                padding: 0;
                margin: 0;
                line-height: 2px;
                }
                .c-rainbow__layer {
                --text-color: var(--color-foreground);
                counter-increment: rainbow;
                font-size: 2.6rem;
                font-weight: 600;
                color: var(--text-color);
                text-shadow: -1px -1px 0 var(--color-black), 1px -1px 0 var(--color-black), -1px 1px 0 var(--color-black), 1px 1px 0 var(--color-black), 4px 4px 0 rgba(0, 0, 0, 0.2);
                animation: rainbow 1.5s ease-in-out infinite;
                white-space: nowrap;
                }
                .c-rainbow__layer:nth-child(1) { animation-delay: calc( 1 / var(--delay) * 1s); margin-left: 36px; }
                .c-rainbow__layer:nth-child(2) { animation-delay: calc( 2 / var(--delay) * 1s); margin-left: 30px; }
                .c-rainbow__layer:nth-child(3) { animation-delay: calc( 3 / var(--delay) * 1s); margin-left: 24px; }
                .c-rainbow__layer:nth-child(4) { animation-delay: calc( 4 / var(--delay) * 1s); margin-left: 18px; }
                .c-rainbow__layer:nth-child(5) { animation-delay: calc( 5 / var(--delay) * 1s); margin-left: 12px; }
                .c-rainbow__layer:nth-child(6) { animation-delay: calc( 6 / var(--delay) * 1s); margin-left: 6px; }
                .c-rainbow__layer:nth-child(7) { animation-delay: calc( 7 / var(--delay) * 1s); margin-left: 0px; }
                .c-rainbow__layer--1 { --text-color: var(--color-1); }
                .c-rainbow__layer--2 { --text-color: var(--color-2); }
                .c-rainbow__layer--3 { --text-color: var(--color-3); }
                .c-rainbow__layer--4 { --text-color: var(--color-4); }
                .c-rainbow__layer--5 { --text-color: var(--color-5); }
                .c-rainbow__layer--6 { --text-color: var(--color-6); }
                .c-rainbow__layer--7 { --text-color: var(--color-white); }
                @keyframes rainbow {
                0%, 100% { transform: translatey(var(--axis-y)); }
                50% { transform: translatey(calc(var(--axis-y) * -1)); }
                }
			</style>
			<div class="container">
                <div class="bg-slide"></div>
                <ul class="c-rainbow">
                    <li class="c-rainbow__layer c-rainbow__layer--1">Hello &amp; Welcome 👋🏻 I'm Abdelrahman Fadel</li>
                    <li class="c-rainbow__layer c-rainbow__layer--2">Hello &amp; Welcome 👋🏻 I'm Abdelrahman Fadel</li>
                    <li class="c-rainbow__layer c-rainbow__layer--3">Hello &amp; Welcome 👋🏻 I'm Abdelrahman Fadel</li>
                    <li class="c-rainbow__layer c-rainbow__layer--4">Hello &amp; Welcome 👋🏻 I'm Abdelrahman Fadel</li>
                    <li class="c-rainbow__layer c-rainbow__layer--5">Hello &amp; Welcome 👋🏻 I'm Abdelrahman Fadel</li>
                    <li class="c-rainbow__layer c-rainbow__layer--6">Hello &amp; Welcome 👋🏻 I'm Abdelrahman Fadel</li>
                    <li class="c-rainbow__layer c-rainbow__layer--7">Hello &amp; Welcome 👋🏻 I'm Abdelrahman Fadel</li>
                </ul>
            </div>
        </div>
	</foreignObject>
</svg>