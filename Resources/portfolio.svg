<svg viewBox="0 0 900 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
            font-family: 'Ubuntu';
            src: url('./Ubuntu/Ubuntu-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        text { font-family: 'Ubuntu', sans-serif; }
      
      .bg { 
        fill: #0b0c10; }
      
      .blob1 {
        fill: #00E5FF;
        opacity: 0.6;
        animation: float1 12s infinite ease-in-out alternate;
        transform-origin: center;
      }
      .blob2 {
        fill: #B141FF;
        opacity: 0.6;
        animation: float2 14s infinite ease-in-out alternate;
        transform-origin: center;
      }
      .blob3 {
        fill: #FF2E93;
        opacity: 0.5;
        animation: float3 16s infinite ease-in-out alternate;
        transform-origin: center;
      }

      @keyframes float1 {
        0%   { transform: translate(0px, 0px) scale(1); }
        50%  { transform: translate(120px, -20px) scale(1.2); }
        100% { transform: translate(-50px, 30px) scale(0.9); }
      }
      @keyframes float2 {
        0%   { transform: translate(0px, 0px) scale(1); }
        50%  { transform: translate(-100px, 30px) scale(1.1); }
        100% { transform: translate(80px, -30px) scale(1.3); }
      }
      @keyframes float3 {
        0%   { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(150px, 15px) scale(1.1); }
      }

      .text {
        font-family: 'Ubuntu', sans-serif;
        font-size: 38px;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.5px;
      }
    </style>
    
    <filter id="blurFilter" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" />
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#B141FF" />
    </linearGradient>

    <clipPath id="bannerClip">
      <rect width="900" height="100" rx='10' ry='10' />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect class="bg" width="900" height="100" />

    <g filter="url(#blurFilter)">
      <circle class="blob1" cx="150" cy="50" r="55" />
      <circle class="blob2" cx="450" cy="80" r="65" />
      <circle class="blob3" cx="750" cy="20" r="50" />
      <circle class="blob1" cx="850" cy="90" r="45" />
      <circle class="blob2" cx="50" cy="10" r="45" />
    </g>

    <rect width="900" height="100" fill="#0b0c10" opacity="0.45" />

    <text x="450" y="52" class="text">
      Check out my <tspan fill="url(#textGrad)">Portfolio 🗂</tspan>
    </text>
  </g>
</svg>
